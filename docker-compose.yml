version: "3.9"

services:
  api:
    build: ./backend
    container_name: alvaresweb
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
  frontend:
    build: ./frontend/spa
    container_name: alvaresweb_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
